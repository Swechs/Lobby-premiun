export const initialMenu=initial        ;
export const ordered=                              (items    )=>[...items].sort((a,b)=>a.sortOrder-b.sortOrder);
// Turkish case mapping first; accent folding also supports ASCII keyboards.
export const normalizeSearch=(value       )=>value.normalize('NFC').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/\p{M}/gu,'').replace(/ı/g,'i').trim();
const priceFormatter=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2});
export const formatPrice=(price            )=>price===null?'':`${priceFormatter.format(price)} TL`;
                                                                          
export function changesBetween(before     ,after     )         {
 const result         =[];
 for(const kind of ['categories','products']         )for(const item of after[kind]){
  const previous=before[kind].find(p=>p.id===item.id);if(!previous)continue;
  for(const field of kind==='products'?['name','description','price','sortOrder','categoryId']:['name','description','sortOrder']){
   const a=(previous                                     )[field],b=(item                                     )[field];
   if(a!==b)result.push({label:previous.name,field,before:a===null?'(boş)':String(a),after:b===null?'(boş)':String(b)});
  }
 }return result;
}
export function validateMenu(input        )                      {
 const m=input        ;
 if(!m||m.schemaVersion!==1||m.sourceTitle!==initialMenu.sourceTitle||m.sourceSha256!==initialMenu.sourceSha256||!Array.isArray(m.categories)||!Array.isArray(m.products))throw new Error('Menü yapısı geçersiz.');
 if(m.categories.length!==23||m.products.length!==158)throw new Error('Kategori veya ürün sayısı değiştirilemez.');
 const text=(s        ,max       ,empty=false)=>typeof s==='string'&&s.length<=max&&(empty||s.trim().length>0);
 const sort=(s        )=>Number.isInteger(s)&&Number(s)>=0&&Number(s)<=100000;
 for(const kind of ['categories','products']         ){
  if(new Set(m[kind].map(p=>p.id)).size!==m[kind].length)throw new Error('Tekrarlanan kimlik.');
  for(const item of m[kind]){const source=initialMenu[kind].find(p=>p.id===item.id);
   if(!source||!text(item.name,160)||!text(item.description,2000,true)||!sort(item.sortOrder)||source.sourceLine!==item.sourceLine)throw new Error('Ürün veya kategori alanlarını kontrol edin.');
   if(kind==='categories'&&(item            ).sourceName!==(source            ).sourceName)throw new Error('Kaynak kategori bilgisi değiştirilemez.');
  }
 }
 for(const p of m.products){const source=initialMenu.products.find(s=>s.id===p.id) ;
  if(!m.categories.some(c=>c.id===p.categoryId)||p.sourceCategoryId!==source.sourceCategoryId||p.sourceCategoryName!==source.sourceCategoryName)throw new Error('Kaynak izlenebilirliği korunmalıdır.');
  if(p.price!==null&&(typeof p.price!=='number'||!Number.isFinite(p.price)||p.price<0||p.price>100000||Math.abs(p.price*100-Math.round(p.price*100))>0.000001))throw new Error('Fiyat en fazla iki ondalıklı bir TL değeri veya boş olmalı.');
 }
}

function setActive(id){active=id;for(const b of document.querySelectorAll('[data-category]')){b.classList.toggle('selected',b.classList.contains('category-link')&&b.dataset.category===id);b.classList.toggle('active',b.classList.contains('chip')&&b.dataset.category===id);b.setAttribute('aria-current',b.dataset.category===id?'true':'false');}const chip=$('#category-rail [data-category="'+id+'"]');if(chip){const rail=$('#category-rail');rail.scrollTo({left:chip.offsetLeft-rail.clientWidth/2+chip.clientWidth/2,behavior:behavior()});}}
function render(){const q=normalizeSearch($('#menu-search').value);$('#clear-search').hidden=!q;const groups=categories().map(category=>({category,products:ordered(state.menu.products.filter(p=>p.categoryId===category.id)).filter(p=>!q||normalizeSearch(category.name+' '+category.description+' '+p.name+' '+p.description).includes(q))})).filter(g=>g.products.length);
 $('#sidebar-categories').innerHTML=categories().map(c=>`<button class="category-link" data-category="${c.id}" data-sidebar="true"><span>${esc(c.name)}</span><span aria-hidden="true">›</span></button>`).join('');
 $('#category-rail').innerHTML=groups.map(({category:c})=>`<button class="chip" data-category="${c.id}">${esc(c.name)}</button>`).join('');
 $('#dialog-categories').innerHTML=groups.map(({category:c,products})=>`<button data-category="${c.id}"><span>${esc(c.name)}<small>${products.length} ürün</small></span><span aria-hidden="true">›</span></button>`).join('');
 const count=groups.reduce((n,g)=>n+g.products.length,0);
 $('#menu-groups').innerHTML=(q?`<p class="search-summary" role="status">“${esc($('#menu-search').value)}” için ${count} ürün</p>`:'')+(groups.length?groups.map(({category:c,products})=>`<section class="menu-section" id="${c.id}" aria-labelledby="${c.id}-title"><div class="section-heading"><div><span class="section-number">${String(categories().findIndex(x=>x.id===c.id)+1).padStart(2,'0')}</span><h2 id="${c.id}-title">${esc(c.name)}</h2></div><span class="product-count">${products.length} ürün</span></div>${c.description?`<p class="category-description">${esc(c.description)}</p>`:''}<ul class="product-list">${products.map(p=>`<li class="product-row" data-product-id="${p.id}"><div class="product-info"><h3>${esc(p.name)}</h3>${p.description?`<p>${esc(p.description)}</p>`:''}</div><span class="product-price">${esc(formatPrice(p.price))}</span></li>`).join('')}</ul></section>`).join(''):`<div class="empty-state"><h2>Aradığınız ürün bulunamadı.</h2><p>Başka bir kelimeyle yeniden deneyebilirsiniz.</p><button class="primary" data-clear>Aramayı temizle</button></div>`);setActive(groups.some(g=>g.category.id===active)?active:groups[0]?.category.id||active);}
function clear(){$('#menu-search').value='';render();$('#menu-search').focus();}
$('#menu-search').addEventListener('input',render);$('#clear-search').addEventListener('click',clear);
document.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){if(b.dataset.sidebar&&$('#menu-search').value){$('#menu-search').value='';render();}$('#categories-dialog').close();setActive(b.dataset.category);history.replaceState(null,'','#'+b.dataset.category);document.getElementById(b.dataset.category)?.scrollIntoView({behavior:behavior(),block:'start'});}if(e.target.closest('[data-clear]'))clear();});
$('#open-categories').onclick=()=>$('#categories-dialog').showModal();$('#close-categories').onclick=()=>$('#categories-dialog').close();$('#categories-dialog').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close();};$('#back-top').onclick=()=>window.scrollTo({top:0,behavior:behavior()});
window.addEventListener('scroll',()=>{const offset=$('.menu-controls').getBoundingClientRect().bottom+35;const sections=[...document.querySelectorAll('.menu-section')];const current=[...sections].reverse().find(s=>s.getBoundingClientRect().top<=offset)||sections[0];if(current&&current.id!==active)setActive(current.id);},{passive:true});
async function refresh(){if(document.hidden)return;try{const r=await fetch('/api/menu',{cache:'no-store'});if(r.ok){const s=await r.json();if(s.revision!==state.revision){state=s;render();}}}catch{}}
render();if(location.hash&&document.querySelector(location.hash))document.querySelector(location.hash).scrollIntoView();
</script></body></html>
